name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build (svelte-check + wxt build)
        run: npm run build

      - name: Zip
        run: npm run zip

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: ad-skipper-chrome
          path: .output/*.zip
          if-no-files-found: error
          include-hidden-files: true # .output is a dotdir, excluded by default
